#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.2/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build Spanish version (default language)
  build-spanish:
    name: build-spanish (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix:
        targets: ["x86_64-pc-windows-msvc"]
        include:
          - runner: windows-latest
            targets: "x86_64-pc-windows-msvc"
          - runner: ubuntu-22.04
            targets: "x86_64-unknown-linux-gnu"
          - runner: macos-latest
            targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/tmenu-es-${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.2/cargo-dist-installer.sh | sh
      - name: Build Spanish (default)
        run: cargo build --release --features lang_es
      - name: Package Spanish
        run: |
          mkdir -p target/distrib
          # On Windows
          if [ -f target/release/tmenu.exe ]; then
            cp target/release/tmenu.exe tmenu-es.exe
            7z a tmenu-es-x86_64-pc-windows-msvc.zip tmenu-es.exe
          fi
          # On Linux
          if [ -f target/release/tmenu ]; then
            cp target/release/tmenu tmenu-es
            tar czf tmenu-es-x86_64-unknown-linux-gnu.tar.gz tmenu-es
          fi
          # On macOS
          if [ -f target/release/tmenu ]; then
            cp target/release/tmenu tmenu-es
            zip tmenu-es-x86_64-apple-darwin.zip tmenu-es
          fi
      - name: Upload Spanish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-spanish-${{ matrix.targets }}
          path: tmenu-es-*

  # Build English version
  build-english:
    name: build-english (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix:
        targets: ["x86_64-pc-windows-msvc"]
        include:
          - runner: windows-latest
            targets: "x86_64-pc-windows-msvc"
          - runner: ubuntu-22.04
            targets: "x86_64-unknown-linux-gnu"
          - runner: macos-latest
            targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/tmenu-en-${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.2/cargo-dist-installer.sh | sh
      - name: Build English
        run: cargo build --release --no-default-features --features lang_en
      - name: Package English
        run: |
          mkdir -p target/distrib
          # On Windows
          if [ -f target/release/tmenu.exe ]; then
            cp target/release/tmenu.exe tmenu-en.exe
            7z a tmenu-en-x86_64-pc-windows-msvc.zip tmenu-en.exe
          fi
          # On Linux
          if [ -f target/release/tmenu ]; then
            cp target/release/tmenu tmenu-en
            tar czf tmenu-en-x86_64-unknown-linux-gnu.tar.gz tmenu-en
          fi
          # On macOS
          if [ -f target/release/tmenu ]; then
            cp target/release/tmenu tmenu-en
            zip tmenu-en-x86_64-apple-darwin.zip tmenu-en
          fi
      - name: Upload English artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-english-${{ matrix.targets }}
          path: tmenu-en-*

  # Consolidate and prepare release assets
  prepare-release:
    name: Prepare Release Assets
    needs:
      - plan
      - build-spanish
      - build-english
    runs-on: ubuntu-22.04
    if: ${{ always() && needs.plan.result == 'success' && (needs.build-spanish.result == 'success' || needs.build-english.result == 'success') }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Organize artifacts
        run: |
          mkdir -p final-release
          # Move Spanish artifacts
          find release-artifacts -name "tmenu-es-*" -exec cp {} final-release/ \;
          # Move English artifacts
          find release-artifacts -name "tmenu-en-*" -exec cp {} final-release/ \;
          # List what we have
          ls -lah final-release/
      - name: Upload consolidated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-release-assets
          path: final-release/

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - prepare-release
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch release artifacts
        uses: actions/download-artifact@v4
        with:
          name: final-release-assets
          path: target/distrib/
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json 2>&1 || true
          echo "dist global build completed (may skip if not needed)"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]?" dist-manifest.json 2>/dev/null || echo "target/distrib/*" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - prepare-release
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts
      - name: Fetch release artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/distrib/
      - id: host
        shell: bash
        run: |
          # Create a combined manifest for upload
          cat > dist-manifest.json <<'EOF'
          {
            "announcement_is_prerelease": false,
            "announcement_title": "tmenu Release",
            "announcement_github_body": "Spanish and English builds ready for download",
            "upload_files": []
          }
          EOF
          echo "artifacts prepared for release"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    needs:
      - plan
      - prepare-release
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download all language builds
        uses: actions/download-artifact@v4
        with:
          name: final-release-assets
          path: release-artifacts
      - name: Create GitHub Release
        env:
          RELEASE_COMMIT: "${{ github.sha }}"
          TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          # Prepare release notes
          cat > release_notes.txt <<'EOF'
          # tmenu Release

          This release includes binaries in **Spanish** and **English**:
          - `tmenu-es-*`: Spanish version (español)
          - `tmenu-en-*`: English version (English)

          Download the appropriate version for your language and platform.
          EOF

          # Create release with all artifacts
          gh release create "$TAG" \
            --title "tmenu $TAG" \
            --notes-file release_notes.txt \
            release-artifacts/*